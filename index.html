<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Dynamic Viewports and Mobile Browser Quirks handling iOS Safari -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA / iOS Web App Tags -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <title>Journey Planner v3</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans selection:bg-blue-100 selection:text-blue-900">
    <div id="app">
      <!-- Desktop/Mobile Header (Minimalist) -->
      <header class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800 px-6 py-3 flex justify-between items-center z-30 transition-colors">
        <div class="flex items-center gap-4">
           <button id="btn-menu-trigger" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors text-slate-500 hover:text-slate-900 dark:hover:text-white" title="Menu">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
           </button>
           <h1 class="text-xl font-bold text-gray-900 dark:text-white tracking-tight" id="journey-title">Journey Planner</h1>
        </div>
        
        <!-- Dropdown Menu (Hidden by default) -->
        <div id="dropdown-menu" class="absolute top-16 left-6 w-64 bg-white dark:bg-slate-900 shadow-2xl rounded-2xl border border-slate-200 dark:border-slate-800 z-[60] hidden overflow-hidden animate-scale-up origin-top-left">
           <div class="p-2">
              <button id="menu-my-journeys" class="w-full text-left px-4 py-3 text-sm font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-colors flex items-center gap-3">
                 <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                 My Journeys
              </button>
              <button id="menu-publish" class="w-full text-left px-4 py-3 text-sm font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-colors flex items-center gap-3">
                 <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                 Publish Journey...
              </button>
              <div class="h-px bg-slate-100 dark:bg-slate-800 my-2"></div>
              <button id="btn-load-demo" class="w-full text-left px-4 py-3 text-sm font-bold text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-colors">Load Demo Journey</button>
           </div>
        </div>
      </header>
      
      <!-- Dashboard (Lobby) -->
      <div id="dashboard-container" class="fixed inset-0 z-50 bg-gray-50 dark:bg-slate-950 overflow-y-auto px-6 py-20 hidden transition-colors duration-500">
         <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-end mb-10">
               <div>
                  <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-2">My Journeys</h2>
                  <p class="text-slate-500 font-medium">Explore your past memories and plan future adventures.</p>
               </div>
               <button id="btn-dashboard-new" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 flex items-center gap-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                  Plan New Trip
               </button>
            </div>
            
            <div id="trips-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
               <!-- Trip cards injected here -->
            </div>
         </div>
      </div>

      <!-- Main Content (Interactive Canvas) -->
      <main id="app-main-content" class="flex-1 overflow-hidden flex flex-col md:flex-row relative">
        
        <!-- Canvas (Map or Calendar - Now on Right Desktop) -->
        <div class="flex-1 w-full md:w-2/3 md:flex-none relative bg-slate-50 dark:bg-slate-900 border-b md:border-b-0 border-slate-300 dark:border-slate-800 flex flex-col hidden md:flex md:order-2 h-full min-h-0" id="left-canvas-area">
          
          <!-- Desktop View Toggle (Hidden on Mobile) -->
          <div id="desktop-view-toggle" class="hidden md:flex absolute top-4 left-4 z-40 bg-white/90 dark:bg-slate-800/90 shadow-lg backdrop-blur-md rounded-2xl p-1 border border-white/20 dark:border-slate-700/50">
            <button class="px-5 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-all bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 shadow-sm">Map</button>
            <button class="px-5 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-all text-slate-400 hover:text-slate-900 dark:hover:text-white">Calendar</button>
          </div>

          <!-- Theme Toggle moved onto Map/Calendar -->
          <button id="btn-theme-toggle" class="absolute top-4 right-4 z-40 bg-white/90 dark:bg-slate-800/90 shadow-lg backdrop-blur-md rounded-2xl p-3 border border-white/20 dark:border-slate-700/50 transition-all hover:scale-110 active:scale-95" title="Toggle Theme">
            <svg id="sun-icon" class="w-6 h-6 text-amber-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
            <svg id="moon-icon" class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
          </button>

          <!-- Map Container -->
          <div id="map-container" class="w-full h-full relative flex items-center justify-center bg-gray-200 dark:bg-slate-900">
             <div class="text-gray-500 dark:text-slate-600 font-medium z-0 pointer-events-none">Map Canvas Offline</div>
             <div id="map-instance" class="absolute inset-0 z-10 w-full h-full"></div>
          </div>

          <!-- Calendar Container (Hidden by default) -->
          <div id="calendar-container" class="w-full h-full relative hidden overflow-y-auto p-6 pt-16 bg-slate-50 dark:bg-slate-950 transition-colors duration-500">
             <!-- Calendar grid will be rendered here by calendar.js -->
             <div class="text-center text-slate-400 mt-10 font-medium">Calendar booting...</div>
          </div>

          <!-- Tickets Container (Hidden by default) -->
          <div id="tickets-container" class="w-full h-full relative hidden overflow-y-auto p-8 flex flex-col items-center justify-center text-center bg-slate-50 dark:bg-slate-950 transition-colors duration-500">
             <div class="w-24 h-24 bg-slate-100 dark:bg-slate-800 rounded-3xl flex items-center justify-center mb-6 shadow-inner">
                <svg class="w-12 h-12 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
             </div>
             <h3 class="text-2xl font-black text-slate-800 dark:text-white tracking-tight">Ticket Wallet</h3>
             <p class="text-slate-500 dark:text-slate-400 mt-2 max-w-xs font-medium">Coming soon: Centralize your boarding passes, hotel confirmations, and QR codes.</p>
          </div>
          
        </div>

        <!-- Timeline / Detail Area (Now on Left Desktop, Bottom on Mobile) -->
        <div id="timeline-container" class="flex-1 w-full md:w-1/3 md:flex-none bg-white dark:bg-slate-950 overflow-y-auto pb-[var(--safe-bottom)] relative md:order-1 md:border-r border-slate-300 dark:border-slate-800 shadow-xl z-20">
          <div class="p-6" id="timeline-content">
            <!-- Timeline rendering placeholder -->
            <div class="animate-pulse space-y-4">
              <div class="h-4 bg-gray-200 rounded w-3/4"></div>
              <div class="h-4 bg-gray-200 rounded w-1/2"></div>
              <div class="h-4 bg-gray-200 rounded w-5/6"></div>
              <div class="h-4 bg-gray-200 dark:bg-slate-800 rounded w-3/4"></div>
              <div class="h-4 bg-gray-200 dark:bg-slate-800 rounded w-1/2"></div>
              <div class="h-4 bg-gray-200 dark:bg-slate-800 rounded w-5/6"></div>
            </div>
            <p class="text-gray-400 dark:text-slate-600 italic text-sm mt-4">Loading journey timeline...</p>
          </div>
        </div>
      </main>

      <!-- Mobile Bottom Navigation -->
      <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 px-6 py-3 pb-[var(--safe-bottom)] flex justify-between items-center z-[50] transition-colors">
        <button class="p-4 flex-1 text-center font-medium text-blue-600 transition-colors">Plan</button>
        <button class="p-4 flex-1 text-center font-medium text-slate-500 dark:text-slate-400 hover:text-gray-900 transition-colors">Map</button>
        <button class="p-4 flex-1 text-center font-medium text-slate-500 dark:text-slate-400 hover:text-gray-900 transition-colors">Calendar</button>
        <button class="p-4 flex-1 text-center font-medium text-slate-500 dark:text-slate-400 hover:text-gray-900 transition-colors">Tickets</button>
      </nav>
    </div>

    <!-- Main Entry Point -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
